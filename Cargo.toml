[workspace]
resolver = "2"
members = [
    "crates/revibe-cli",
    "crates/revibe-core",
    "crates/revibe-llm",
    "crates/revibe-tools",
    "crates/revibe-mcp",
    "crates/revibe-acp"
]

[workspace.package]
version = "1.2.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/mistralai/revibe"
authors = ["Devstral 2"]
keywords = ["ai", "cli", "coding-assistant", "mistral", "llm", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
# Internal crates
revibe-core = { path = "crates/revibe-core" }
revibe-llm = { path = "crates/revibe-llm" }
revibe-tools = { path = "crates/revibe-tools" }
revibe-mcp = { path = "crates/revibe-mcp" }
revibe-acp = { path = "crates/revibe-acp" }

# Async runtime
tokio = { version = "1.44", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }

# CLI
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
crossterm = "0.28"
ratatui = "0.29"

# Terminal UI
indicatif = "0.17"
console = "0.15"
dialoguer = "0.11"
syntect = "5.2"

# Logging and errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"

# Utilities
uuid = { version = "1.16", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
regex = "1.11"
glob = "0.3"
dirs = "6.0"
dotenvy = "0.15"
once_cell = "1.21"
parking_lot = "0.12"

# JSON Schema
schemars = "0.8"

# Process execution
portable-pty = "0.8"

# File watching
notify = "7.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
